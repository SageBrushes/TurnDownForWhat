[pytest]
# Pytest configuration for Sonos TTS Web Service

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum Python version
minversion = 7.0

# Test paths
testpaths = tests

# Output options
addopts =
    # Verbose output
    -v
    # Show local variables in tracebacks
    --tb=short
    # Show summary of all test outcomes
    -ra
    # Strict markers (fail on unknown markers)
    --strict-markers
    # Show warnings
    -W default
    # Coverage options (uncomment to enable)
    # --cov=app
    # --cov-report=html
    # --cov-report=term-missing
    # --cov-fail-under=80

# Async support
asyncio_mode = auto

# Markers for organizing tests
markers =
    asyncio: marks tests as async (using pytest-asyncio)
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests

# Ignore patterns
norecursedirs = .git .venv venv __pycache__ *.egg-info static templates

# Console output format
console_output_style = progress

# Timeout for tests (in seconds)
# Requires pytest-timeout plugin
# timeout = 300

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Filter warnings
filterwarnings =
    # Ignore all DeprecationWarnings from third-party libraries
    ignore::DeprecationWarning
    # But show DeprecationWarnings from our own code
    default::DeprecationWarning:app.*
