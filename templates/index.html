<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turn Down For What - Sonos Controller</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .control-panel {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .control-group {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .volume-control {
            flex: 1;
            min-width: 200px;
        }

        .volume-control label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #555;
        }

        .volume-slider {
            width: 100%;
            height: 10px;
            border-radius: 5px;
            background: #e0e0e0;
            outline: none;
            -webkit-appearance: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
        }

        .volume-slider::-moz-range-thumb {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            border: none;
        }

        .volume-value {
            display: inline-block;
            margin-left: 10px;
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
            min-width: 60px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: 600;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .speakers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .speaker-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .speaker-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .speaker-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .speaker-name {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
        }

        .speaker-status {
            font-size: 1.5em;
        }

        .speaker-info {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .speaker-track {
            color: #667eea;
            font-weight: 500;
            margin-bottom: 15px;
            font-style: italic;
        }

        .speaker-volume {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .speaker-volume input {
            flex: 1;
        }

        .speaker-volume-value {
            font-size: 1.2em;
            font-weight: bold;
            min-width: 40px;
            color: #667eea;
        }

        .status-log {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            max-height: 400px;
            overflow-y: auto;
        }

        .status-log h2 {
            margin-bottom: 15px;
            color: #333;
        }

        .log-entry {
            padding: 8px 12px;
            margin-bottom: 5px;
            background: #f5f5f5;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }

        .log-entry.success {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .log-entry.error {
            background: #ffebee;
            color: #c62828;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.2em;
        }

        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .refresh-btn {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔊 Turn Down For What</h1>
            <p>Sonos Speaker Control Center</p>
        </div>

        <div class="control-panel">
            <div class="control-group">
                <div class="volume-control">
                    <label for="targetVolume">
                        Target Volume for All Speakers:
                        <span class="volume-value" id="volumeDisplay">5</span>
                    </label>
                    <input type="range" id="targetVolume" class="volume-slider" min="0" max="100" value="5">
                </div>
                <button id="adjustBtn" onclick="adjustAllVolumes()">Adjust All Speakers</button>
                <button id="refreshBtn" class="refresh-btn" onclick="loadSpeakers()">🔄 Refresh</button>
            </div>
        </div>

        <div id="loadingIndicator" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Discovering speakers...</p>
        </div>

        <div id="speakersContainer" class="speakers-grid"></div>

        <div class="status-log">
            <h2>Activity Log</h2>
            <div id="statusLog"></div>
        </div>
    </div>

    <script>
        let pollingInterval = null;

        // Update volume display
        document.getElementById('targetVolume').addEventListener('input', (e) => {
            document.getElementById('volumeDisplay').textContent = e.target.value;
        });

        // Load speakers on page load
        window.addEventListener('load', () => {
            loadSpeakers();
        });

        async function loadSpeakers() {
            document.getElementById('loadingIndicator').style.display = 'block';
            document.getElementById('speakersContainer').innerHTML = '';

            try {
                const response = await fetch('/api/speakers');
                const speakers = await response.json();

                document.getElementById('loadingIndicator').style.display = 'none';

                if (speakers.error) {
                    addLog(`Error: ${speakers.error}`, 'error');
                    return;
                }

                if (speakers.length === 0) {
                    document.getElementById('speakersContainer').innerHTML =
                        '<div style="grid-column: 1/-1; text-align: center; color: white; font-size: 1.2em;">No speakers found. Make sure your Sonos speakers are on the same network.</div>';
                    return;
                }

                displaySpeakers(speakers);
                addLog(`Found ${speakers.length} speaker(s)`, 'success');
            } catch (error) {
                document.getElementById('loadingIndicator').style.display = 'none';
                addLog(`Error loading speakers: ${error.message}`, 'error');
            }
        }

        function displaySpeakers(speakers) {
            const container = document.getElementById('speakersContainer');
            container.innerHTML = '';

            speakers.forEach(speaker => {
                const statusEmoji = speaker.state === 'PLAYING' ? '🎵' :
                                   speaker.state === 'PAUSED_PLAYBACK' ? '⏸️' : '⏹️';

                const card = document.createElement('div');
                card.className = 'speaker-card';
                card.innerHTML = `
                    <div class="speaker-header">
                        <div class="speaker-name">${speaker.name}</div>
                        <div class="speaker-status">${statusEmoji}</div>
                    </div>
                    <div class="speaker-info">IP: ${speaker.ip}</div>
                    <div class="speaker-info">State: ${speaker.state.replace(/_/g, ' ')}</div>
                    <div class="speaker-track">🎼 ${speaker.track}</div>
                    <div class="speaker-volume">
                        <input type="range" class="volume-slider" min="0" max="100"
                               value="${speaker.volume}"
                               onchange="setSpeakerVolume('${speaker.name}', this.value)">
                        <span class="speaker-volume-value">${speaker.volume}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function adjustAllVolumes() {
            const targetVolume = parseInt(document.getElementById('targetVolume').value);
            const btn = document.getElementById('adjustBtn');

            btn.disabled = true;
            btn.textContent = 'Adjusting...';

            try {
                const response = await fetch('/api/adjust', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ target_volume: targetVolume })
                });

                const result = await response.json();

                if (result.error) {
                    addLog(`Error: ${result.error}`, 'error');
                    btn.disabled = false;
                    btn.textContent = 'Adjust All Speakers';
                    return;
                }

                addLog(`Started adjustment to volume ${targetVolume}`, 'success');
                startPollingStatus();
            } catch (error) {
                addLog(`Error: ${error.message}`, 'error');
                btn.disabled = false;
                btn.textContent = 'Adjust All Speakers';
            }
        }

        async function setSpeakerVolume(speakerName, volume) {
            try {
                const response = await fetch(`/api/speaker/${encodeURIComponent(speakerName)}/volume`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ volume: parseInt(volume) })
                });

                const result = await response.json();

                if (result.error) {
                    addLog(`Error setting volume for ${speakerName}: ${result.error}`, 'error');
                } else {
                    addLog(`Set ${speakerName} volume to ${volume}`, 'success');
                }
            } catch (error) {
                addLog(`Error: ${error.message}`, 'error');
            }
        }

        function startPollingStatus() {
            if (pollingInterval) {
                clearInterval(pollingInterval);
            }

            pollingInterval = setInterval(async () => {
                try {
                    const response = await fetch('/api/status');
                    const status = await response.json();

                    if (status.progress && status.progress.length > 0) {
                        status.progress.forEach(msg => {
                            if (!document.getElementById('statusLog').textContent.includes(msg)) {
                                addLog(msg, 'success');
                            }
                        });
                    }

                    if (!status.running) {
                        clearInterval(pollingInterval);
                        pollingInterval = null;

                        const btn = document.getElementById('adjustBtn');
                        btn.disabled = false;
                        btn.textContent = 'Adjust All Speakers';

                        if (status.error) {
                            addLog(`Error: ${status.error}`, 'error');
                        } else {
                            addLog('Adjustment complete!', 'success');
                            setTimeout(loadSpeakers, 1000);
                        }
                    }
                } catch (error) {
                    console.error('Polling error:', error);
                }
            }, 1000);
        }

        function addLog(message, type = '') {
            const logContainer = document.getElementById('statusLog');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            const timestamp = new Date().toLocaleTimeString();
            entry.textContent = `[${timestamp}] ${message}`;
            logContainer.insertBefore(entry, logContainer.firstChild);

            // Keep only last 20 entries
            while (logContainer.children.length > 20) {
                logContainer.removeChild(logContainer.lastChild);
            }
        }
    </script>
</body>
</html>
